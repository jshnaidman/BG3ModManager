name: Build PR 479 fork release

on:
  push:
    branches:
      - release/pr-479-wine-fix-1

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out PR source commit
        uses: actions/checkout@v4
        with:
          ref: 9d80ed303911b6544d276581c0f42e57cefa4b92
          submodules: recursive

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Pin .NET 8 SDK
        shell: pwsh
        run: |
          $sdkVersion = (dotnet --list-sdks | Where-Object { $_ -match '^8\.' } | Select-Object -Last 1).Split(' ')[0]
          if (-not $sdkVersion) { throw ".NET 8 SDK was not found" }
          @{ sdk = @{ version = $sdkVersion; rollForward = "latestPatch" } } |
            ConvertTo-Json -Depth 3 |
            Set-Content global.json
          dotnet --version

      - name: Install LSLib parser generators
        shell: pwsh
        run: |
          $dependencies = @(
            @{
              Name = "gplex"
              Url = "https://s3.eu-central-1.amazonaws.com/nb-stor/dos-legacy/ExportTool/gplex-distro-1_2_2.zip"
              Sha256 = "22f6c2ce7785fad217f6c47b3890304e092d24c613323f4f0363ab9190332ba5"
              Root = "gplex-distro-1_2_2"
            },
            @{
              Name = "gppg"
              Url = "https://s3.eu-central-1.amazonaws.com/nb-stor/dos-legacy/ExportTool/gppg-distro-1_5_2.zip"
              Sha256 = "94b55a051200471aba765d50404abe66a14742913e224adcb65b4e8383d2905a"
              Root = "gppg-distro-1_5_2"
            }
          )

          foreach ($dependency in $dependencies) {
            $archive = Join-Path $env:RUNNER_TEMP "$($dependency.Name).zip"
            $expanded = Join-Path $env:RUNNER_TEMP "$($dependency.Name)-expanded"
            $destination = "External/lslib/External/$($dependency.Name)"
            Invoke-WebRequest $dependency.Url -OutFile $archive
            $actualHash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualHash -ne $dependency.Sha256) {
              throw "$($dependency.Name) checksum mismatch: $actualHash"
            }
            Expand-Archive $archive -DestinationPath $expanded
            New-Item -ItemType Directory -Path $destination -Force | Out-Null
            Copy-Item "$expanded/$($dependency.Root)/*" $destination -Recurse -Force
          }

      - name: Generate LSLib parser sources
        shell: pwsh
        run: |
          msbuild External/lslib/LSLib/LSLib.csproj /t:PreBuildStoryGppgFiles /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          msbuild External/lslib/LSLibStats/LSLibStats.csproj /t:PreBuildStatsGppgFiles /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $expectedFiles = @(
            "External/lslib/LSLib/LS/Story/GoalParser/Goal.lex.cs",
            "External/lslib/LSLib/LS/Story/GoalParser/Goal.yy.cs",
            "External/lslib/LSLib/LS/Story/HeaderParser/StoryHeader.lex.cs",
            "External/lslib/LSLib/LS/Story/HeaderParser/StoryHeader.yy.cs",
            "External/lslib/LSLibStats/Stats/File/Stat.lex.cs",
            "External/lslib/LSLibStats/Stats/File/Stat.yy.cs",
            "External/lslib/LSLibStats/Stats/Functor/Functor.lex.cs",
            "External/lslib/LSLibStats/Stats/Functor/Functor.yy.cs",
            "External/lslib/LSLibStats/Stats/Functor/Lua.lex.cs",
            "External/lslib/LSLibStats/Stats/Functor/Lua.yy.cs",
            "External/lslib/LSLibStats/Stats/Functor/Requirement.lex.cs",
            "External/lslib/LSLibStats/Stats/Functor/Requirement.yy.cs",
            "External/lslib/LSLibStats/Stats/Functor/RollConditions.lex.cs",
            "External/lslib/LSLibStats/Stats/Functor/RollConditions.yy.cs"
          )
          foreach ($path in $expectedFiles) {
            if (-not (Test-Path $path) -or (Get-Item $path).Length -le 0) {
              throw "Expected generated parser source not found: $path"
            }
          }

      - name: Run regression tests
        run: dotnet test tests/BG3ModManager.Tests/BG3ModManager.Tests.csproj --configuration Release

      - name: Build release package
        shell: pwsh
        run: |
          dotnet restore BG3ModManager.sln -p:Platform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          msbuild BG3ModManager.sln /m /p:Configuration=Publish /p:Platform=x64 /p:GeneratePackageOnBuild=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate and rename package
        shell: pwsh
        run: |
          $source = "BG3ModManager_v1.0.12.9.zip"
          $destination = "BG3ModManager_v1.0.12.9-pr479-wine-fix.zip"
          if (-not (Test-Path $source)) { throw "Expected package not found: $source" }
          Move-Item $source $destination
          if ((Get-Item $destination).Length -le 0) { throw "Release package is empty" }

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: pr-479-wine-fix-package
          path: BG3ModManager_v1.0.12.9-pr479-wine-fix.zip
          if-no-files-found: error
          retention-days: 30
